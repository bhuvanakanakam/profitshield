name: ProfitShield tests
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  development-policy:
    name: Development branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROFITSHIELD_PR_BASE: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_development_workflow.py' -v
      - run: python .github/scripts/check_pr_base.py
  backend:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    env:
      TZ: America/New_York
      PYTHONDONTWRITEBYTECODE: '1'
      SQUARE_ENV: sandbox
      SQUARE_ACCESS_TOKEN: ''
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  frontend:
    name: Node calculations and Python data bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/New_York
      PYTHONDONTWRITEBYTECODE: '1'
      SQUARE_ENV: sandbox
      SQUARE_ACCESS_TOKEN: ''
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test tests/js/*.test.cjs
